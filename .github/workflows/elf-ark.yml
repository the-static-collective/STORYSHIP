name: STORYSHIP ELF Ark 001
on:
  push:
    branches:
      - feat/storyship-elf-ark-001
  pull_request:
permissions:
  contents: read
jobs:
  elf-ark-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ELF Ark adapter and refusal cases
        run: node --test test/elf-ark.test.mjs
      - name: Verify existing Storyship test suite
        run: npm test
